server.port=${SERVER_PORT:8080}

# DataSource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/amanah_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:amanah_user}
spring.datasource.password=${DB_PASSWORD:amanah_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:amanah_jwt_secret_replace_in_production_min_32_chars_ok}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Disable JPA auto-ddl (we use Flyway + JdbcTemplate)
spring.jpa.hibernate.ddl-auto=none

# Logging
logging.level.com.amanah=DEBUG
logging.level.org.springframework.jdbc=DEBUG
